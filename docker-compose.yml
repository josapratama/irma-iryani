version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: irma-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: irma_admin
      MONGO_INITDB_ROOT_PASSWORD: irma_password
      MONGO_INITDB_DATABASE: irma_db
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: irma-backend
    restart: unless-stopped
    ports:
      - "3006:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://irma_admin:irma_password@mongodb:27017/irma_db?authSource=admin
      JWT_SECRET: irma-super-secret-jwt-key-2026
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: irma-frontend
    restart: unless-stopped
    ports:
      - "3007:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3006/api
    depends_on:
      - backend

volumes:
  mongo_data:
